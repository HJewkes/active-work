name: CI

on:
  push:
    branches: [main]
  # Unfiltered so `check` reports on every PR, whatever it targets; a filtered-out required check blocks the merge.
  pull_request:

# The whole grant. A called workflow can never hold more than its caller grants,
# and node.yml asks for nothing beyond this.
permissions:
  contents: read

# The shared standard (HJewkes/ci): `std` runs secrets (gitleaks), audit
# (critical advisories only), and `pnpm verify`, which is format, lint,
# typecheck, the mining-tools check, the CLI build, the tests under a sandboxed
# HOME, the CLI-reference generator smoke, and the full build. No compat
# matrix: the package ships CLI binaries, not a library, as before on Node 22 only.
jobs:
  std:
    uses: HJewkes/ci/.github/workflows/node.yml@660e273ea1a0ebaa8a7fd73427f3f6a0a812c99e
    with:
      node-version: '22'
      audit-level: critical

  # The ruleset requires the context `check`, so the aggregator carries that name
  # and no other job may. all-green also fails if a job here is missing from needs.
  check:
    if: always()
    needs: [std]
    runs-on: ubuntu-latest
    steps:
      - uses: HJewkes/ci/actions/all-green@660e273ea1a0ebaa8a7fd73427f3f6a0a812c99e
        with:
          needs: ${{ toJSON(needs) }}
