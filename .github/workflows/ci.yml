name: CI

on:
  push:
    branches: [main]
  # Unfiltered so `check` reports on every PR, whatever it targets; a filtered-out required check blocks the merge.
  pull_request:

# The whole grant. A called workflow can never hold more than its caller grants,
# and node.yml asks for nothing beyond this.
permissions:
  contents: read

# The shared standard (HJewkes/ci): `std` runs secrets (gitleaks), audit
# (critical advisories only), and `pnpm verify`, which is format, lint,
# typecheck, the mining-tools check, the CLI build, the tests under a sandboxed
# HOME, the CLI-reference generator smoke, and the full build. No compat
# matrix: the package ships CLI binaries, not a library, on the pinned Node only.
jobs:
  std:
    uses: HJewkes/ci/.github/workflows/node.yml@v1
    with:
      # Keep equal to .node-version; node.yml takes no node-version-file yet (CC-911).
      node-version: '24.21.0'
      audit-level: critical

  # A merge gate behind the pre-push hook `prepare` installs. CI has no private term list.
  egress-scan:
    runs-on: ubuntu-latest
    steps:
      # The PR head sha, not the merge ref, so GitHub's synthetic merge commit is not scanned.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # The scan reads every commit in the range, not only its endpoints.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Scan the pushed commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npx --yes @titan-design/egress-scan@0.5.1 range "$BASE_SHA" "$HEAD_SHA"

  # The ruleset requires the context `check`, so the aggregator carries that name
  # and no other job may. all-green also fails if a job here is missing from needs.
  check:
    if: always()
    needs: [std, egress-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: HJewkes/ci/actions/all-green@v1
        with:
          needs: ${{ toJSON(needs) }}
